<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keine Verbindung</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 2rem 2rem 5rem;
  }
  .icon-wrap {
    width: 96px;
    height: 96px;
    background: linear-gradient(135deg, #1e3a8a, #0d3daf);
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2rem;
    box-shadow: 0 8px 32px rgba(13,61,175,0.4);
  }
  .icon-wrap svg {
    width: 52px;
    height: 52px;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0.75rem;
    color: #f1f5f9;
  }
  p {
    color: #94a3b8;
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 2.5rem;
    max-width: 280px;
  }
  button {
    background: linear-gradient(135deg, #1e3a8a, #0d3daf);
    color: white;
    border: none;
    border-radius: 0.75rem;
    padding: 0.875rem 2.5rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    box-shadow: 0 4px 16px rgba(13,61,175,0.35);
    letter-spacing: 0.01em;
  }
  button:active {
    opacity: 0.85;
    transform: scale(0.97);
  }
</style>
</head>
<body>
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3L2 8l10 5 10-5-10-5z" fill="white" stroke="white" stroke-width="0.5" stroke-linejoin="round"/>
      <path d="M6 10.5v5c0 1.657 2.686 3 6 3s6-1.343 6-3v-5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M22 8v5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>Keine Verbindung</h1>
  <p>Bitte überprüfe deine Internetverbindung und versuche es erneut.</p>
  <button onclick="window.location.reload()">Erneut versuchen</button>
</body>
</html>
