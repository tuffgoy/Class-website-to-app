<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keine Verbindung</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 2rem;
  }
  .icon { font-size: 4rem; margin-bottom: 1.5rem; }
  h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; color: #f1f5f9; }
  p { color: #94a3b8; font-size: 1rem; line-height: 1.6; margin-bottom: 2rem; }
  button {
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 0.75rem;
    padding: 0.875rem 2rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:active { opacity: 0.8; }
</style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Keine Verbindung</h1>
  <p>Bitte überprüfe deine Internetverbindung und versuche es erneut.</p>
  <button onclick="window.location.reload()">Erneut versuchen</button>
</body>
</html>
