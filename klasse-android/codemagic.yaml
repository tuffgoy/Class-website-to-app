workflows:
  android-release:
    name: Klasse Android — Release APK
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      android_signing:
        - klasse_keystore
      vars:
        PACKAGE_NAME: "com.klasse.app"
      java: 17

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: release/*
          include: true
          source: true

    scripts:
      - name: Locate project root
        script: |
          # Handle both layouts:
          #   A) gradlew is at repo root  (user pushed contents of klasse-android/)
          #   B) gradlew is one level down (user pushed the klasse-android/ folder)
          if [ -f "$CM_BUILD_DIR/gradlew" ]; then
            echo "ANDROID_ROOT=$CM_BUILD_DIR" >> $CM_ENV
          elif [ -f "$CM_BUILD_DIR/klasse-android/gradlew" ]; then
            echo "ANDROID_ROOT=$CM_BUILD_DIR/klasse-android" >> $CM_ENV
          else
            echo "ERROR: gradlew not found under $CM_BUILD_DIR"
            find "$CM_BUILD_DIR" -name "gradlew" | head -5
            exit 1
          fi

      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$ANDROID_ROOT/local.properties"

      - name: Build release APK
        script: |
          cd "$ANDROID_ROOT"
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName="1.0.$BUILD_NUMBER"

    artifacts:
      - "**/**/outputs/apk/release/*.apk"
      - "**/**/outputs/mapping/release/mapping.txt"

    publishing:
      email:
        recipients:
          - your-email@example.com    # ← replace with your email
        notify:
          success: true
          failure: true

  android-debug:
    name: Klasse Android — Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m1

    environment:
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    scripts:
      - name: Locate project root
        script: |
          if [ -f "$CM_BUILD_DIR/gradlew" ]; then
            echo "ANDROID_ROOT=$CM_BUILD_DIR" >> $CM_ENV
          elif [ -f "$CM_BUILD_DIR/klasse-android/gradlew" ]; then
            echo "ANDROID_ROOT=$CM_BUILD_DIR/klasse-android" >> $CM_ENV
          else
            echo "ERROR: gradlew not found under $CM_BUILD_DIR"
            find "$CM_BUILD_DIR" -name "gradlew" | head -5
            exit 1
          fi

      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$ANDROID_ROOT/local.properties"

      - name: Build debug APK
        script: |
          cd "$ANDROID_ROOT"
          chmod +x ./gradlew
          ./gradlew assembleDebug

    artifacts:
      - "**/**/outputs/apk/debug/*.apk"
