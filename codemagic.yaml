workflows:
  android-release:
    name: Klasse Android — Release APK
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      android_signing:
        - klasse_keystore           # name of your keystore in Codemagic → Teams → Code signing
      vars:
        PACKAGE_NAME: "com.klasse.app"
      java: 17

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: release/*
          include: true
          source: true

    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Build release APK
        script: |
          cd "$CM_BUILD_DIR"
          ./gradlew assembleRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName="1.0.$BUILD_NUMBER"

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - your-email@example.com    # ← replace with your email
        notify:
          success: true
          failure: true

  android-debug:
    name: Klasse Android — Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m1

    environment:
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
        - pattern: main
          include: false   # debug only on feature branches

    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Build debug APK
        script: |
          cd "$CM_BUILD_DIR"
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
